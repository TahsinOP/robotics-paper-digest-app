[server]
runOnSave = false

[browser]
gatherUsageStats = false

[client]
# "viewer" keeps the ⋮ menu so Settings → Theme can switch between light and dark.
toolbarMode = "viewer"

[theme]
# Palette and serif follow Tahsin's website (TahsinOP.github.io): plum on white, orchid on near-black.
# Source Serif 4 for titles and reading text; IBM Plex Sans for the interface.
font = "'IBM Plex Sans':https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap"
headingFont = "'Source Serif 4':https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400..700;1,8..60,400..700&display=swap"
baseFontSize = 16
headingFontWeights = [600, 600, 600, 600, 600, 600]
headingFontSizes = ["2.3rem", "1.5rem", "1.2rem"]
baseRadius = "8px"
buttonRadius = "8px"
showWidgetBorder = true

[theme.light]
primaryColor = "#8a1c7c"
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f5f6f7"
textColor = "#16181d"
borderColor = "#cfd3d8"
linkColor = "#8a1c7c"

[theme.light.sidebar]
backgroundColor = "#f5f6f7"
secondaryBackgroundColor = "#eceef1"

[theme.dark]
primaryColor = "#e58ad9"
backgroundColor = "#17181a"
secondaryBackgroundColor = "#202226"
textColor = "#e8e9eb"
borderColor = "#3a3d44"
linkColor = "#e58ad9"

[theme.dark.sidebar]
backgroundColor = "#1c1d20"
secondaryBackgroundColor = "#26282d"
