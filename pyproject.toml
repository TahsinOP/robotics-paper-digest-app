[project]
name = "robotics-paper-radar"
version = "0.1.0"
description = "Find, rank, summarize and read recent robotics papers: a personal desktop app."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "streamlit>=1.66,<2",
    "requests>=2.31",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "anthropic>=1.15",
    "pypdf>=6.0",
    "pydantic>=2.7",
]

[project.scripts]
paper-radar = "paper_radar.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/paper_radar"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
# ROS 2 puts its pytest plugins on PYTHONPATH; they don't load under this Python, so skip them.
addopts = """-q -p no:launch_testing -p no:launch_ros -p no:ament_copyright -p no:ament_flake8
    -p no:ament_xmllint -p no:ament_pep257 -p no:ament_lint"""
